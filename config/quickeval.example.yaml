app:
  environment: development
  shutdown_timeout: 10s

http:
  address: 127.0.0.1:8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s

log:
  level: info
  file: logs/quickeval.log

mysql:
  host: 127.0.0.1
  port: 3307
  user: quickeval
  database: quickeval
  parameters: charset=utf8mb4
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m

redis:
  host: 127.0.0.1
  port: 6380
  database: 0

paths:
  migrations: migrations
  uploads: uploads

upload:
  max_file_size: 10485760
  max_files_per_owner: 10
  allowed_media_types:
    - image/png
    - image/jpeg
    - image/webp

security:
  session_cookie: quickeval_session
  session_ttl: 12h
  cookie_secure: false
  login_max_attempts: 5
  login_window: 15m
  password_min_length: 10
