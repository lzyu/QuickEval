                  items: { $ref: "#/components/schemas/HomeBadcase" }
                recent_datasets:
                  type: array
                  items: { $ref: "#/components/schemas/HomeDataset" }
                recent_activities:
                  type: array
                  items: { $ref: "#/components/schemas/HomeActivity" }
