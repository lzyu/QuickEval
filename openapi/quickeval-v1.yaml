        scenarios:
          type: array
          items: { $ref: "#/components/schemas/DashboardOption" }
        datasets:
          type: array
          items: { $ref: "#/components/schemas/DashboardOption" }
        dataset_versions:
          type: array
          items: { $ref: "#/components/schemas/DashboardOption" }
