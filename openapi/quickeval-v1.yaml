      properties:
        dataset_id: { $ref: "#/components/schemas/UUID" }
        version_id: { $ref: "#/components/schemas/UUID" }
        dataset_name: { type: string }
        evaluation_target_name: { type: string }
        version_no: { type: integer, minimum: 1 }
        case_count: { type: integer, minimum: 0 }
