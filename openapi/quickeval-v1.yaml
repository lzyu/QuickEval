      properties:
        version_id: { $ref: "#/components/schemas/UUID" }
        version_no: { type: integer, minimum: 1 }
        completed_run_count: { type: integer, minimum: 0 }
        evaluated_case_count: { type: integer, minimum: 0 }
        average_score: { type: [number, "null"], minimum: 1, maximum: 5 }
        evaluation_badcase_count: { type: integer, minimum: 0 }
        evaluation_badcase_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
    DashboardOption:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
