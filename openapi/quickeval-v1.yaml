openapi: 3.1.0
info:
  title: QuickEval V1 API
  version: 0.1.0
  description: Internal API for the QuickEval Vue SPA.
servers:
  - url: /
tags:
  - name: System
    description: Runtime health and system metadata.
  - name: Authentication
  - name: Users
  - name: Catalog
  - name: Datasets
  - name: Evaluations
  - name: Attachments
  - name: Badcases
  - name: Reporting
  - name: Search
  - name: Exports
  - name: Audit
paths:
  /health/live:
    get:
      tags:
        - System
      operationId: getLiveness
      summary: Check whether the API process is alive
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    get:
      tags:
        - System
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      security: []
      responses:
        "200":
          description: MySQL and Redis are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded and the session cookie was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session bootstrap data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Authentication]
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session revoked.
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and all sessions revoked.
        "422":
          $ref: "#/components/responses/Error"
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
        - name: role
          in: query
          schema: { type: string, enum: [admin, member] }
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: User page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Users]
      operationId: createUser
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Users]
      operationId: getUser
      responses:
        "200":
          description: User detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags: [Users]
      operationId: updateUser
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/users/{user_id}/{state_action}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: state_action
        in: path
        required: true
        schema: { type: string, enum: [enable, disable] }
    post:
      tags: [Users]
      operationId: setUserState
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateRequest"
      responses:
        "200":
          description: User state changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/users/{user_id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Users]
      operationId: resetUserPassword
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and user sessions revoked.
  /api/v1/evaluation-targets:
    get:
      tags: [Catalog]
      operationId: listEvaluationTargets
      responses:
        "200":
          description: Evaluation target page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPageResponse"
    post:
      tags: [Catalog]
      operationId: createEvaluationTarget
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Named"
      responses:
        "201":
          description: Evaluation target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
  /api/v1/evaluation-targets/{target_id}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Catalog]
      operationId: getEvaluationTarget
      responses:
        "200":
          description: Evaluation target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
    put:
      tags: [Catalog]
      operationId: updateEvaluationTarget
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Named"
      responses:
        "200":
          description: Evaluation target updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
  /api/v1/evaluation-targets/{target_id}/{state_action}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/StateAction"
    post:
      tags: [Catalog]
      operationId: setEvaluationTargetState
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/State"
      responses:
        "200":
          description: Evaluation target state changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
  /api/v1/scenarios:
    get:
      tags: [Catalog]
      operationId: listScenarios
      responses:
        "200":
          description: Scenario page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioPageResponse"
    post:
      tags: [Catalog]
      operationId: createScenario
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
      responses:
        "201":
          description: Scenario created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
  /api/v1/scenarios/{scenario_id}:
    parameters:
      - $ref: "#/components/parameters/ScenarioID"
    get:
      tags: [Catalog]
      operationId: getScenario
      responses:
        "200":
          description: Scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
    put:
      tags: [Catalog]
      operationId: updateScenario
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
      responses:
        "200":
          description: Scenario updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
  /api/v1/scenarios/{scenario_id}/{state_action}:
    parameters:
      - $ref: "#/components/parameters/ScenarioID"
      - $ref: "#/components/parameters/StateAction"
    post:
      tags: [Catalog]
      operationId: setScenarioState
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/State"
      responses:
        "200":
          description: Scenario state changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
  /api/v1/scenarios/{scenario_id}/case-tags:
    parameters:
      - $ref: "#/components/parameters/ScenarioID"
    get:
      tags: [Catalog]
      operationId: listCaseTags
      responses:
        "200":
          description: Case tags for the scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
    post:
      tags: [Catalog]
      operationId: createCaseTag
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Named"
      responses:
        "201":
          description: Case tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
  /api/v1/case-tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/TagID"
    put:
      tags: [Catalog]
      operationId: updateCaseTag
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Named"
      responses:
        "200":
          description: Case tag updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
  /api/v1/case-tags/{tag_id}/{state_action}:
    parameters:
      - $ref: "#/components/parameters/TagID"
      - $ref: "#/components/parameters/StateAction"
    post:
      tags: [Catalog]
      operationId: setCaseTagState
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/State"
      responses:
        "200":
          description: Case tag state changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
  /api/v1/scenarios/{scenario_id}/case-tags/reorder:
    parameters:
      - $ref: "#/components/parameters/ScenarioID"
    put:
      tags: [Catalog]
      operationId: reorderCaseTags
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Reorder"
      responses:
        "204":
          description: Case tags reordered.
  /api/v1/scenarios/{scenario_id}/available-case-tags:
    parameters:
      - $ref: "#/components/parameters/ScenarioID"
    get:
      tags: [Catalog]
      operationId: listAvailableCaseTags
      responses:
        "200":
          description: Active global and scenario-specific tags available to cases in this scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableCaseTagsResponse"
  /api/v1/case-tags:
    get:
      tags: [Catalog]
      operationId: listManagedCaseTags
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [global, scenario] }
        - name: scenario_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: Case tags in one management scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
    post:
      tags: [Catalog]
      operationId: createManagedCaseTag
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseTagRequest"
      responses:
        "201":
          description: Global or scenario-specific case tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
  /api/v1/issue-tags:
    get:
      tags: [Catalog]
      operationId: listIssueTags
      responses:
        "200":
          description: Issue tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
    post:
      tags: [Catalog]
      operationId: createIssueTag
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Named"
      responses:
        "201":
          description: Issue tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
  /api/v1/issue-tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/TagID"
    put:
      tags: [Catalog]
      operationId: updateIssueTag
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Named"
      responses:
        "200":
          description: Issue tag updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
  /api/v1/issue-tags/{tag_id}/{state_action}:
    parameters:
      - $ref: "#/components/parameters/TagID"
      - $ref: "#/components/parameters/StateAction"
    post:
      tags: [Catalog]
      operationId: setIssueTagState
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/State"
      responses:
        "200":
          description: Issue tag state changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
  /api/v1/issue-tags/reorder:
    put:
      tags: [Catalog]
      operationId: reorderIssueTags
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: "#/components/requestBodies/Reorder"
      responses:
        "204":
          description: Issue tags reordered.
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Audit log page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPageResponse"
  /api/v1/datasets:
    get:
      tags: [Datasets]
      operationId: listDatasets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: evaluation_target_id
          in: query
          schema: { $ref: "#/components/schemas/UUID" }
        - name: scenario_id
          in: query
          schema: { $ref: "#/components/schemas/UUID" }
        - name: status
          in: query
          schema: { type: string, enum: [active, archived] }
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Dataset page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetPageResponse" }
    post:
      tags: [Datasets]
      operationId: createDataset
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetRequest" }
      responses:
        "201":
          description: Dataset and its initial draft were created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDatasetResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{dataset_id}:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    get:
      tags: [Datasets]
      operationId: getDataset
      responses:
        "200":
          description: Dataset and version history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetDetailResponse" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Datasets]
      operationId: updateDataset
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetRequest" }
      responses:
        "200":
          description: Dataset updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{dataset_id}/{dataset_action}:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
      - name: dataset_action
        in: path
        required: true
        schema: { type: string, enum: [archive, restore] }
    post:
      tags: [Datasets]
      operationId: setDatasetState
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody: { $ref: "#/components/requestBodies/State" }
      responses:
        "200":
          description: Dataset state changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/datasets/{dataset_id}/versions:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    get:
      tags: [Datasets]
      operationId: listDatasetVersions
      responses:
        "200":
          description: Dataset version history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetVersionListResponse" }
  /api/v1/datasets/{dataset_id}/drafts:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    post:
      tags: [Datasets]
      operationId: createDatasetDraft
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDraftRequest" }
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetVersionResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/dataset-versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/VersionID"
    get:
      tags: [Datasets]
      operationId: getDatasetVersion
      responses:
        "200":
          description: Dataset version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetVersionResponse" }
    delete:
      tags: [Datasets]
      operationId: deleteDatasetDraft
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: expected_lock_version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "204": { description: Draft deleted. }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/dataset-versions/{version_id}/{version_action}:
    parameters:
      - $ref: "#/components/parameters/VersionID"
      - name: version_action
        in: path
        required: true
        schema: { type: string, enum: [publish, archive] }
    post:
      tags: [Datasets]
      operationId: setDatasetVersionState
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishVersionRequest" }
      responses:
        "200":
          description: Version state changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetVersionResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/dataset-versions/{version_id}/cases:
    parameters:
      - $ref: "#/components/parameters/VersionID"
    get:
      tags: [Datasets]
      operationId: listVersionCases
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Version case page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionCasePageResponse" }
    post:
      tags: [Datasets]
      operationId: createVersionCase
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionCaseRequest" }
      responses:
        "201":
          description: Case created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionCaseResponse" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/version-cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/CaseID"
    get:
      tags: [Datasets]
      operationId: getVersionCase
      responses:
        "200":
          description: Version case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionCaseResponse" }
    patch:
      tags: [Datasets]
      operationId: updateVersionCase
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionCaseRequest" }
      responses:
        "200":
          description: Case updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionCaseResponse" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Datasets]
      operationId: deleteVersionCase
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: expected_lock_version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "204": { description: Case deleted. }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/dataset-versions/{version_id}/cases/reorder:
    parameters:
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [Datasets]
      operationId: reorderVersionCases
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderCasesRequest" }
      responses:
        "204": { description: Cases reordered. }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/case-import-template.csv:
    get:
      tags: [Datasets]
      operationId: downloadCaseImportTemplate
      responses:
        "200":
          description: UTF-8 BOM CSV template.
          content:
            text/csv:
              schema: { type: string }
  /api/v1/dataset-versions/{version_id}/case-imports/preview:
    parameters:
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [Datasets]
      operationId: previewCaseImport
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
