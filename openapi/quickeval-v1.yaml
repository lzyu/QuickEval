        - $ref: "#/components/parameters/DashboardTargetID"
        - $ref: "#/components/parameters/DashboardScenarioID"
        - $ref: "#/components/parameters/DashboardDatasetID"
        - $ref: "#/components/parameters/DashboardVersionID"
        - $ref: "#/components/parameters/DashboardEvaluatorID"
        - $ref: "#/components/parameters/DashboardAgentVersion"
        - $ref: "#/components/parameters/DashboardEnvironment"
        - $ref: "#/components/parameters/DashboardSourceType"
        - $ref: "#/components/parameters/DashboardBadcaseStatus"
        - $ref: "#/components/parameters/DashboardIssueTagID"
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
      responses:
        "200":
          description: Real-time dashboard aggregates for completed evaluations and valid Badcases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardResponse" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/pages/datasets/{dataset_id}/version-comparison:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    get:
      tags: [Reporting]
      operationId: getDatasetVersionComparison
      parameters:
        - $ref: "#/components/parameters/DashboardEvaluatorID"
        - $ref: "#/components/parameters/DashboardAgentVersion"
        - $ref: "#/components/parameters/DashboardEnvironment"
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
      responses:
        "200":
          description: Completed evaluation results compared by dataset version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionComparisonResponse" }
  /api/v1/evaluation-results:
    get:
      tags: [Reporting]
      operationId: listCompletedEvaluationResults
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DashboardTargetID"
        - $ref: "#/components/parameters/DashboardScenarioID"
        - $ref: "#/components/parameters/DashboardDatasetID"
        - $ref: "#/components/parameters/DashboardVersionID"
        - $ref: "#/components/parameters/DashboardEvaluatorID"
        - $ref: "#/components/parameters/DashboardAgentVersion"
        - $ref: "#/components/parameters/DashboardEnvironment"
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
        - name: result_id
          in: query
          schema: { $ref: "#/components/schemas/UUID" }
        - name: result_status
          in: query
          schema: { type: string, enum: [evaluated, skipped] }
        - name: score
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: skip_reason
          in: query
          schema: { type: string, maxLength: 500 }
        - name: has_badcase
          in: query
          schema: { type: string, enum: ["0", "1"] }
        - name: scored
          in: query
          schema: { type: string, enum: ["0", "1"] }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Paginated details from completed evaluations for dashboard drill-down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationResultDetailPageResponse" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/search:
    get:
      tags: [Search]
      operationId: globalSearch
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: types
          in: query
          schema:
            type: string
            description: Comma-separated subset of target,scenario,dataset,case,evaluation_result,badcase.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated quick-location search results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/exports/evaluation-results.csv:
    get:
      tags: [Exports]
      operationId: exportEvaluationResults
      parameters:
        - $ref: "#/components/parameters/DashboardTargetID"
        - $ref: "#/components/parameters/DashboardScenarioID"
        - $ref: "#/components/parameters/DashboardDatasetID"
        - $ref: "#/components/parameters/DashboardVersionID"
        - $ref: "#/components/parameters/DashboardEvaluatorID"
        - $ref: "#/components/parameters/DashboardAgentVersion"
        - $ref: "#/components/parameters/DashboardEnvironment"
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
      responses:
        "200":
          description: UTF-8 BOM CSV containing completed evaluation result details.
          content:
            text/csv:
              schema: { type: string }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/exports/badcases.csv:
    get:
      tags: [Exports]
      operationId: exportBadcases
      parameters:
        - $ref: "#/components/parameters/DashboardTargetID"
        - $ref: "#/components/parameters/DashboardScenarioID"
        - $ref: "#/components/parameters/DashboardDatasetID"
        - $ref: "#/components/parameters/DashboardVersionID"
        - $ref: "#/components/parameters/DashboardEvaluatorID"
        - $ref: "#/components/parameters/DashboardAgentVersion"
        - $ref: "#/components/parameters/DashboardEnvironment"
        - $ref: "#/components/parameters/DashboardSourceType"
        - $ref: "#/components/parameters/DashboardBadcaseStatus"
        - $ref: "#/components/parameters/DashboardIssueTagID"
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
      responses:
        "200":
          description: UTF-8 BOM CSV containing valid Badcases and authenticated evidence URLs.
          content:
            text/csv:
              schema: { type: string }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/exports/badcase-distribution.csv:
    get:
      tags: [Exports]
      operationId: exportBadcaseDistribution
      parameters:
        - $ref: "#/components/parameters/DashboardTargetID"
        - $ref: "#/components/parameters/DashboardScenarioID"
        - $ref: "#/components/parameters/DashboardDatasetID"
        - $ref: "#/components/parameters/DashboardVersionID"
        - $ref: "#/components/parameters/DashboardEvaluatorID"
        - $ref: "#/components/parameters/DashboardAgentVersion"
        - $ref: "#/components/parameters/DashboardEnvironment"
        - $ref: "#/components/parameters/DashboardSourceType"
        - $ref: "#/components/parameters/DashboardBadcaseStatus"
        - $ref: "#/components/parameters/DashboardIssueTagID"
        - $ref: "#/components/parameters/DashboardFrom"
        - $ref: "#/components/parameters/DashboardTo"
      responses:
        "200":
          description: UTF-8 BOM CSV containing tag, status, and source distributions.
          content:
            text/csv:
              schema: { type: string }
        "422": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DashboardTargetID:
      name: evaluation_target_id
      in: query
      schema: { $ref: "#/components/schemas/UUID" }
    DashboardScenarioID:
      name: scenario_id
      in: query
      schema: { $ref: "#/components/schemas/UUID" }
    DashboardDatasetID:
      name: dataset_id
      in: query
      schema: { $ref: "#/components/schemas/UUID" }
    DashboardVersionID:
      name: dataset_version_id
      in: query
      schema: { $ref: "#/components/schemas/UUID" }
    DashboardEvaluatorID:
      name: evaluator_id
      in: query
      schema: { $ref: "#/components/schemas/UUID" }
    DashboardAgentVersion:
      name: agent_version
      in: query
      schema: { type: string }
    DashboardEnvironment:
      name: environment
      in: query
      schema: { $ref: "#/components/schemas/EvaluationEnvironment" }
    DashboardSourceType:
      name: source_type
      in: query
      schema: { type: string, enum: [evaluation, business] }
    DashboardBadcaseStatus:
      name: badcase_status
      in: query
      schema: { $ref: "#/components/schemas/BadcaseStatus" }
    DashboardIssueTagID:
      name: issue_tag_id
      in: query
      schema: { $ref: "#/components/schemas/UUID" }
    DashboardFrom:
      name: from
      in: query
      schema: { $ref: "#/components/schemas/UTCTimestamp" }
    DashboardTo:
      name: to
      in: query
      schema: { $ref: "#/components/schemas/UTCTimestamp" }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    TargetID:
      name: target_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    ScenarioID:
      name: scenario_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    TagID:
      name: tag_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    DatasetID:
      name: dataset_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    VersionID:
      name: version_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    CaseID:
      name: case_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    ResultID:
      name: result_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    BadcaseID:
      name: badcase_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    AttachmentID:
      name: attachment_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 200 }
    StateAction:
      name: state_action
      in: path
      required: true
      schema: { type: string, enum: [enable, disable] }
  requestBodies:
    Named:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NamedRequest"
    State:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StateRequest"
    Reorder:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReorderRequest"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: quickeval_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    UUID:
      type: string
      format: uuid
    UTCTimestamp:
      type: string
      format: date-time
      examples:
        - 2026-07-27T06:20:00.000Z
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 10 }
    CreateUserRequest:
      type: object
      required: [username, display_name, role, password]
      properties:
        username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,63}$" }
        display_name: { type: string, minLength: 1 }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [admin, member] }
        password: { type: string, minLength: 10 }
    UpdateUserRequest:
      type: object
      required: [display_name, role, expected_lock_version]
      properties:
        display_name: { type: string, minLength: 1 }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [admin, member] }
        expected_lock_version: { type: integer, minimum: 0 }
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 10 }
    StateRequest:
      type: object
      required: [expected_lock_version]
      properties:
        expected_lock_version: { type: integer, minimum: 0 }
    NamedRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        expected_lock_version: { type: integer, minimum: 0, default: 0 }
    ScenarioRequest:
      allOf:
        - $ref: "#/components/schemas/NamedRequest"
        - type: object
          required: [evaluation_target_id]
          properties:
            evaluation_target_id: { $ref: "#/components/schemas/UUID" }
    CaseTagRequest:
      allOf:
        - $ref: "#/components/schemas/NamedRequest"
        - type: object
          required: [scope]
          properties:
            scope: { type: string, enum: [global, scenario] }
            scenario_id: { type: [string, "null"], format: uuid }
    ReorderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, sort_order, expected_lock_version]
            properties:
              id: { $ref: "#/components/schemas/UUID" }
              sort_order: { type: integer, minimum: 0 }
              expected_lock_version: { type: integer, minimum: 0 }
    User:
      type: object
      required: [id, username, display_name, role, status, lock_version]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [admin, member] }
        status: { type: string, enum: [active, disabled] }
        lock_version: { type: integer, minimum: 0 }
        created_at: { $ref: "#/components/schemas/UTCTimestamp" }
        updated_at: { $ref: "#/components/schemas/UTCTimestamp" }
    Session:
      type: object
      required: [user, permissions, features, upload_policy, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions:
          type: object
          additionalProperties: { type: boolean }
        features:
          type: object
          required: [oa_login_enabled]
          properties:
            oa_login_enabled: { type: boolean }
        upload_policy:
          type: object
          required: [allowed_media_types, max_file_size, max_files_per_owner]
          properties:
            allowed_media_types:
              type: array
              items: { type: string }
            max_file_size: { type: integer }
            max_files_per_owner: { type: integer }
        csrf_token: { type: string }
    CatalogItem:
      type: object
      required: [id, name, status, lock_version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        lock_version: { type: integer, minimum: 0 }
        created_at: { $ref: "#/components/schemas/UTCTimestamp" }
        updated_at: { $ref: "#/components/schemas/UTCTimestamp" }
    Scenario:
      allOf:
        - $ref: "#/components/schemas/CatalogItem"
        - type: object
          required: [evaluation_target_id, evaluation_target_name]
          properties:
            evaluation_target_id: { $ref: "#/components/schemas/UUID" }
            evaluation_target_name: { type: string }
    Tag:
      allOf:
        - $ref: "#/components/schemas/CatalogItem"
        - type: object
          required: [sort_order]
          properties:
            scope: { type: string, enum: [global, scenario] }
            scenario_id: { type: [string, "null"], format: uuid }
            scenario_name: { type: [string, "null"] }
            sort_order: { type: integer, minimum: 0 }
    AuditLog:
      type: object
      required: [id, action, entity_type, entity_id, request_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        actor_user_id: { type: [string, "null"], format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { $ref: "#/components/schemas/UUID" }
        before_data: {}
        after_data: {}
        request_id: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        created_at: { $ref: "#/components/schemas/UTCTimestamp" }
    DatasetRequest:
      type: object
      required: [evaluation_target_id, name]
      properties:
        evaluation_target_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        expected_lock_version: { type: integer, minimum: 0, default: 0 }
    CreateDraftRequest:
      type: object
      required: [expected_dataset_lock_version]
      properties:
        base_version_id: { type: [string, "null"], format: uuid }
        expected_dataset_lock_version: { type: integer, minimum: 0 }
    PublishVersionRequest:
      type: object
      required: [expected_lock_version]
      properties:
        release_note: { type: [string, "null"] }
        expected_lock_version: { type: integer, minimum: 0 }
    VersionCaseRequest:
      type: object
      required: [user_prompt]
      properties:
        scenario_id: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"], maxLength: 200 }
        user_prompt: { type: string, minLength: 1 }
        precondition: { type: [string, "null"] }
        expected_result: { type: [string, "null"] }
        judging_guide: { type: [string, "null"] }
        is_enabled: { type: boolean, default: true }
        tag_ids:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
        expected_lock_version: { type: integer, minimum: 0, default: 0 }
    ReorderCaseItem:
      type: object
      required: [id, sort_order, expected_lock_version]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        sort_order: { type: integer, minimum: 0 }
        expected_lock_version: { type: integer, minimum: 0 }
    ReorderCasesRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReorderCaseItem" }
    CommitImportRequest:
      type: object
      required: [import_token]
      properties:
        import_token: { type: string, minLength: 1 }
    Dataset:
      type: object
      required:
        - id
        - evaluation_target_id
        - evaluation_target_name
        - evaluation_target_status
        - name
        - status
        - lock_version
        - created_at
        - updated_at
        - published_version_count
        - draft_case_count
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        evaluation_target_id: { $ref: "#/components/schemas/UUID" }
        evaluation_target_name: { type: string }
        evaluation_target_status: { type: string, enum: [active, disabled] }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [active, archived] }
        lock_version: { type: integer, minimum: 0 }
        created_at: { $ref: "#/components/schemas/UTCTimestamp" }
        updated_at: { $ref: "#/components/schemas/UTCTimestamp" }
        latest_version_no: { type: [integer, "null"], minimum: 1 }
        published_version_count: { type: integer, minimum: 0 }
        draft_version_id: { type: [string, "null"], format: uuid }
        draft_case_count: { type: integer, minimum: 0 }
    DatasetVersion:
      type: object
      required:
        - id
        - dataset_id
        - status
        - lock_version
        - created_at
        - updated_at
        - case_count
        - enabled_count
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        dataset_id: { $ref: "#/components/schemas/UUID" }
        base_version_id: { type: [string, "null"], format: uuid }
        version_no: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
        release_note: { type: [string, "null"] }
        lock_version: { type: integer, minimum: 0 }
        published_at: { type: [string, "null"], format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { $ref: "#/components/schemas/UTCTimestamp" }
        updated_at: { $ref: "#/components/schemas/UTCTimestamp" }
        case_count: { type: integer, minimum: 0 }
        enabled_count: { type: integer, minimum: 0 }
    CaseTagSnapshot:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
    VersionCase:
      type: object
      required:
        - id
        - dataset_version_id
        - case_key
        - scenario_id
        - scenario_name
        - scenario_status
        - scenario_assignment_status
        - user_prompt
        - sort_order
        - is_enabled
        - lock_version
        - tags
        - created_at
        - updated_at
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        dataset_version_id: { $ref: "#/components/schemas/UUID" }
        case_key: { $ref: "#/components/schemas/UUID" }
        scenario_id: { type: [string, "null"], format: uuid }
        scenario_name: { type: [string, "null"] }
        scenario_status: { type: [string, "null"], enum: [active, disabled, null] }
        scenario_assignment_status:
          type: string
          enum: [unclassified, suggested, confirmed]
        name: { type: [string, "null"] }
        user_prompt: { type: string }
        precondition: { type: [string, "null"] }
        expected_result: { type: [string, "null"] }
        judging_guide: { type: [string, "null"] }
        sort_order: { type: integer, minimum: 0 }
        is_enabled: { type: boolean }
        lock_version: { type: integer, minimum: 0 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/CaseTagSnapshot" }
        created_at: { $ref: "#/components/schemas/UTCTimestamp" }
        updated_at: { $ref: "#/components/schemas/UTCTimestamp" }
    ImportPreviewRow:
      type: object
      required:
        - row_number
        - name
        - user_prompt
        - precondition
        - expected_result
        - judging_guide
        - tag_names
        - is_enabled
        - errors
      properties:
        row_number: { type: integer, minimum: 2 }
        name: { type: string }
        user_prompt: { type: string }
        precondition: { type: string }
        expected_result: { type: string }
        judging_guide: { type: string }
        tag_names:
          type: array
          items: { type: string }
        is_enabled: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    ImportPreview:
      type: object
      required:
        - import_token
        - version_lock_version
        - rows
        - has_errors
        - valid_row_count
        - error_row_count
      properties:
        import_token: { type: string }
        version_lock_version: { type: integer, minimum: 0 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportPreviewRow" }
        has_errors: { type: boolean }
        valid_row_count: { type: integer, minimum: 0 }
        error_row_count: { type: integer, minimum: 0 }
    DatasetResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Dataset" }
    CreateDatasetResponse:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [dataset, draft]
              properties:
                dataset: { $ref: "#/components/schemas/Dataset" }
                draft: { $ref: "#/components/schemas/DatasetVersion" }
    DatasetDetailResponse:
      allOf:
